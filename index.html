<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Inventar Pro</title>

<style>
body { font-family: Arial; text-align: center; padding: 20px; }
input, button { padding: 8px; margin: 5px; }
table { margin: 20px auto; border-collapse: collapse; width: 95%; }
td, th { border: 1px solid #ccc; padding: 6px; }
img { width: 50px; height: 50px; object-fit: cover; }
</style>
</head>

<body>

<h2>📦 Inventar Pro</h2>

<input type="file" accept="image/*" capture="environment" id="imageInput"><br>
<input type="text" id="name" placeholder="Produktname">
<input type="number" id="price" placeholder="Preis €">
<input type="number" id="stock" placeholder="Menge">
<br>
<button onclick="saveProduct()">Speichern</button>

<br><br>
<input type="text" id="search" placeholder="🔍 Suchen..." oninput="renderTable()">

<h3>📊 Bestand</h3>
<table id="table"></table>

<script>
let editIndex = null;

function getDB() {
  return JSON.parse(localStorage.getItem("products") || "[]");
}

function saveDB(db) {
  localStorage.setItem("products", JSON.stringify(db));
}

// 🔥 Bild verkleinern (WICHTIG!)
function compressImage(file, callback) {
  let reader = new FileReader();
  reader.onload = function(e) {
    let img = new Image();
    img.onload = function() {
      let canvas = document.createElement("canvas");
      let maxSize = 300;
      let scale = maxSize / Math.max(img.width, img.height);

      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      let ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      let compressed = canvas.toDataURL("image/jpeg", 0.6);
      callback(compressed);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveProduct() {
  let file = document.getElementById("imageInput").files[0];
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let stock = document.getElementById("stock").value;

  if (!name) {
    alert("Name fehlt!");
    return;
  }

  let db = getDB();

  function finishSave(imageData) {
    let product = { image: imageData, name, price, stock };

    if (editIndex !== null) {
      db[editIndex] = product;
      editIndex = null;
    } else {
      db.push(product);
    }

    saveDB(db);
    renderTable();

    // 🔥 Formular reset
    document.getElementById("imageInput").value = "";
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("stock").value = "";
  }

  if (file) {
    compressImage(file, finishSave);
  } else {
    finishSave("");
  }
}

function deleteProduct(index) {
  let db = getDB();
  db.splice(index, 1);
  saveDB(db);
  renderTable();
}

function editProduct(index) {
  let db = getDB();
  let p = db[index];

  document.getElementById("name").value = p.name;
  document.getElementById("price").value = p.price;
  document.getElementById("stock").value = p.stock;

  editIndex = index;
}

function renderTable() {
  let db = getDB();
  let search = document.getElementById("search").value.toLowerCase();
  let table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>Bild</th>
      <th>Name</th>
      <th>Preis</th>
      <th>Menge</th>
      <th>Aktion</th>
    </tr>
  `;

  db.forEach((p, i) => {
    if (!p.name.toLowerCase().includes(search)) return;

    table.innerHTML += `
      <tr>
        <td>${p.image ? `<img src="${p.image}">` : ""}</td>
        <td>${p.name}</td>
        <td>${p.price}€</td>
        <td>${p.stock}</td>
        <td>
          <button onclick="editProduct(${i})">✏️</button>
          <button onclick="deleteProduct(${i})">❌</button>
        </td>
      </tr>
    `;
  });
}

renderTable();
</script>

</body>
</html>
